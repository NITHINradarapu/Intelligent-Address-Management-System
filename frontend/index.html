<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Address Management System</h1>

    <!-- Navigation tabs -->
    <div class="tabs">
        <button class="tab active" onclick="showSection('customers')">Customers</button>
        <button class="tab" onclick="showSection('addresses')">Addresses</button>
    </div>

    <!-- ==================== CUSTOMERS SECTION ==================== -->
    <div id="customers-section" class="section">
        <h2>Create Customer</h2>
        <form id="customer-form">
            <label>Name
                <input type="text" id="cust-name" required>
            </label>
            <label>Email
                <input type="email" id="cust-email" required>
            </label>
            <label>Phone (10 digits)
                <input type="text" id="cust-phone" pattern="[0-9]{10}" required>
            </label>
            <button type="submit">Create Customer</button>
        </form>

        <!-- Edit Customer (hidden by default) -->
        <div id="edit-customer-section" style="display:none;">
            <h2>Edit Customer</h2>
            <form id="edit-customer-form">
                <input type="hidden" id="edit-cust-id">
                <label>Name
                    <input type="text" id="edit-cust-name" required>
                </label>
                <label>Email
                    <input type="email" id="edit-cust-email" required>
                </label>
                <label>Phone (10 digits)
                    <input type="text" id="edit-cust-phone" pattern="[0-9]{10}" required>
                </label>
                <div class="button-group">
                    <button type="submit">Update</button>
                    <button type="button" onclick="cancelEdit()">Cancel</button>
                </div>
            </form>
        </div>

        <h2>All Customers</h2>
        <button onclick="loadCustomers()">Refresh</button>
        <table id="customers-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- ==================== ADDRESSES SECTION ==================== -->
    <div id="addresses-section" class="section" style="display:none;">
        <h2>Add Address</h2>
        <form id="address-form">
            <label>Customer ID
                <input type="number" id="addr-customer-id" required>
            </label>
            <label>Raw Address
                <textarea id="addr-raw" rows="3" required placeholder="e.g. Flat 101, Prestige Towers, MG Road, Bangalore 560001"></textarea>
            </label>
            <button type="submit">Submit Address</button>
        </form>

        <h2>View Addresses</h2>
        <div class="inline-form">
            <label>Customer ID
                <input type="number" id="lookup-customer-id">
            </label>
            <button onclick="loadAddresses()">Load Addresses</button>
        </div>

        <table id="addresses-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Raw Address</th>
                    <th>Formatted Address</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Postal Code</th>
                    <th>Confidence</th>
                    <th>Status</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Address detail card (shown when a row is clicked) -->
        <div id="address-detail" style="display:none;">
            <h3>Address Details</h3>
            <div id="address-detail-content"></div>
            <button onclick="document.getElementById('address-detail').style.display='none'">Close</button>
        </div>
    </div>

    <!-- Toast for messages -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
